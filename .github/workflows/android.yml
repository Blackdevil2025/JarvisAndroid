name: Build Jarvis APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK 34
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report the exact error
        if: failure()
        run: |
          tail -100 build.log | grep -E "error:|FAILED|What went wrong|Could not|Caused by|Exception" | head -12 | sed 's/^/::error::/' >> "$GITHUB_OUTPUT" || true
          {
            echo "### Build failed — error lines:"
            echo '```'
            tail -100 build.log | grep -E "error:|FAILED|What went wrong|Could not|Caused by|Exception" | head -12
            echo '```'
            echo "Full log: open the Build step."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
