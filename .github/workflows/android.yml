name: Build Jarvis APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report the exact error
        if: failure()
        run: |
          grep -E "error:|FAILED|What went wrong|Could not|Caused by|Exception" build.log | tail -15 | sed 's/^/::error::/' || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
